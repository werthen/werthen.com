---
layout: inner
---

<article class="inner-article">
  <p class="inner-article-meta">
    {% if page.date %}<span>{{ page.date | date: "%B %Y" }}</span>{% endif %}
    {% if page.talk_type %}<span class="badge">{{ page.talk_type }}</span>{% endif %}
  </p>

  {% if page.venue %}
  <p class="inner-article-venue">{{ page.venue }}{% if page.location %} · {{ page.location }}{% endif %}</p>
  {% endif %}

  <div class="prose">
    {{ content }}
  </div>
</article>
