{% assign base_path = site.url | append: site.baseurl %}
<!doctype html>
<html lang="en">
<head>
  <title>{{ page.title }} — {{ site.title }}</title>
  {% include site-head.html %}
  <link rel="stylesheet" href="{{ base_path }}/assets/css/inner.css" />
</head>
<body>
  <div class="page">
    {% include site-nav.html %}

    <main class="inner">
      <h1 class="inner-title">{{ page.title }}</h1>
      {{ content }}
    </main>

    {% include site-foot.html %}
  </div>
</body>
</html>
